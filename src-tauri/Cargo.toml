[package]
name = "ttvchat-sound-alerts"
version = "3.0.0"
edition = "2021"

[dependencies]
futures-util = "0.3.34"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[build-dependencies]
tauri-build = "2.7.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

